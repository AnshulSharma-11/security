name: nexavise-sentinel
x-backend-env: &env
  SENTINEL_SECRET_KEY: ${SENTINEL_SECRET_KEY:?copy .env.example to .env and set SENTINEL_SECRET_KEY}
  SENTINEL_DATABASE_URL: postgresql+psycopg2://sentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sentinel
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  SENTINEL_BOOTSTRAP_ADMIN_EMAIL: ${SENTINEL_BOOTSTRAP_ADMIN_EMAIL:-}
  SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:-}
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: sentinel, POSTGRES_DB: sentinel, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sentinel"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    networks: [backend]
  api:
    build: ./backend
    environment: *env
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  worker:                       # isolated scanner container: separate image, no published ports, locked down
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    environment: *env
    depends_on: [db, redis]
    networks: [backend, scan]   # 'scan' is the only network that can reach assessment targets
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp", "/home/sentinel/.config"]
    mem_limit: 1g
    pids_limit: 256
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    networks: [frontend]
  lab-target:                   # optional, intentionally vulnerable local lab: `docker compose --profile lab up`
    image: bkimminich/juice-shop:latest
    profiles: [lab]
    networks: [scan]
networks:
  backend: {internal: true}     # db/redis are unreachable from outside and from targets
  frontend: {}
  scan: {}
volumes:
  pgdata: {}
